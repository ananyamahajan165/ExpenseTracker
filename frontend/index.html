<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Expense Tracker</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN SECTION -->
<div id="loginSection" class="login-box">
  <div class="card">
<h2>Expense Breakdown</h2>
<canvas id="expenseChart"></canvas>
</div>

<h2>Login</h2>

<input type="text" id="loginUsername" placeholder="Username">
<input type="password" id="loginPassword" placeholder="Password">

<button onclick="loginUser()">Login</button>

<p>
Don't have an account?
<span onclick="showRegister()">Register</span>
</p>


<!-- REGISTER FORM -->
<div id="registerForm" style="display:none;">

<h3>Create Account</h3>

<input type="text" id="registerUsername" placeholder="Username">
<input type="password" id="registerPassword" placeholder="Password">

<button onclick="registerUser()">Register</button>

<p>
Already have an account?
<span onclick="showLogin()">Login</span>
</p>

</div>

</div>


<!-- DASHBOARD -->
<div id="dashboardSection" style="display:none;">
  <div class="container">

    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h1>Smart Expense Analytics Dashboard</h1>
      <div>
        <span id="welcomeUser"></span>
        <button onclick="logoutUser()">Logout</button>
      </div>
    </div>

    <!-- Budget -->
<div class="card">

<h2>Budget Status</h2>

<input type="number" id="budgetInput" placeholder="Enter Monthly Budget">

<button onclick="setBudget()">Set Budget</button>

<p>Monthly Budget: ₹ <span id="budgetAmount">0</span></p>

<p>Remaining: ₹ <span id="remainingAmount">0</span></p>

<p id="budgetWarning"></p>

</div>



<div id="authSection">
  <h2>Login / Signup</h2>

  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">

  <button onclick="signup()">Signup</button>
  <button onclick="login()">Login</button>
</div>


    
    <!-- Add Expense -->
    <div class="card">
      <h2>Add Expense</h2>

      <form id="expenseForm">

        <select id="category">
          <option value="">Select Category</option>
          <option value="FOOD">Food</option>
          <option value="TRAVEL">Travel</option>
          <option value="RENT">Rent</option>
          <option value="SHOPPING">Shopping</option>
          <option value="UTILITIES">Utilities</option>
          <option value="OTHER">Other</option>
        </select>

        <input type="number" id="amount" placeholder="Amount">

        <input type="text" id="description" placeholder="Description">

        <button type="button" onclick="addExpense()">Add Expense</button>

      </form>
    </div>

    <!-- Total -->
    <div class="card">
      <h2>Total Spending</h2>
      <h1>₹ <span id="totalAmount">0</span></h1>
    </div>

    <!-- Expenses Table -->
    <div class="card">
      <h2>All Expenses</h2>

      <table id="expenseTable">
        <thead>
          <tr>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
            <th>Description</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody></tbody>
      </table>

    </div>

  </div>
</div>
<div class="header"></div>

<script src="script.js"></script>

</body>

</html>
