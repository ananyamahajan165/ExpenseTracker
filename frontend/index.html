<head>
  <meta charset="UTF-8">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
   <div id="loginSection" class="card">
    <h2>Login</h2>

    <input type="text" id="loginUsername" placeholder="Username" />
    <input type="password" id="loginPassword" placeholder="Password" />

    <button onclick="loginUser()">Login</button>
  </div>


  <!-- DASHBOARD SECTION -->
  <div id="dashboardSection" style="display:none;">
    
    <h1>Smart Expense Analytics Dashboard</h1>

    <div class="card">
      <h2>Add Expense</h2>
      <form id="expenseForm">
        <select id="category" required>
  <option value="">Select Category</option>
  <option value="FOOD">Food</option>
  <option value="TRAVEL">Travel</option>
  <option value="RENT">Rent</option>
  <option value="SHOPPING">Shopping</option>
  <option value="UTILITIES">Utilities</option>
  <option value="OTHER">Other</option>
</select>
        <input type="number" id="amount" placeholder="Amount" required />
        <input type="text" id="description" placeholder="Description" required />
        <button type="button" onclick="addExpense()">Add Expense</button>
      </form>
    </div>

    <div class="card">
      <h2>Total Spending</h2>
      <h1 style="font-size:28px;">₹ <span id="totalAmount">0</span></h1>
    </div>

    <div class="card">
      <h2>All Expenses</h2>

      <p id="loadingMessage" style="display:none;">Loading expenses...</p>
      <p id="emptyMessage" style="display:none;">No expenses added yet.</p>

      <table id="expenseTable">
        <thead>
          <tr>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
            <th>Description</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

    </div>
  </div>

  <script src="script.js"></script>
</body>
